name: Atualizar manifest da galeria

on:
  push:
    branches: [main]
    paths:
      - 'galeria/gifs/**.gif'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-manifest
  cancel-in-progress: true

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar manifest.json
        run: node galeria/generate-manifest.js

      - name: Commit e push (se houve alterações)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- galeria/gifs/manifest.json; then
            git add galeria/gifs/manifest.json
            git commit -m "chore: atualizar manifest da galeria [skip ci]"
            git push
          else
            echo "Manifest sem alterações."
          fi
